services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./code/QAR/.env
    ports:
      - "8001:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - qar_index:/workspace/code/QAR/vector_index

  frontend:
    build:
      context: ./code/QAR/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  huggingface_cache:
  qar_index:
